@startuml uc-01-compte-administration
title Rolliste — Compte et administration (v0.2)
skinparam shadowing false
skinparam monochrome false
skinparam defaultFontName Arial
skinparam defaultFontSize 13
skinparam packageStyle rectangle
skinparam ArrowColor #444444
skinparam actor {
  BorderColor #444444
  BackgroundColor #FFFFFF
}
skinparam usecase {
  BackgroundColor #F4F6FA
  BorderColor #4A5A7A
}
skinparam rectangle {
  BorderColor #4A5A7A
}
skinparam note {
  BackgroundColor #FFF8DC
  BorderColor #B8A060
}
left to right direction

actor "Visiteur" as Visitor
actor "Utilisateur" as User
actor "Administrateur" as Admin
actor "Service d'e-mail" as Mail <<système>>

User <|- - Admin

rectangle "Rolliste" {
  package "Compte" {
    usecase "S'inscrire" as UC_Register
    usecase "Se connecter" as UC_Login
    usecase "Réinitialiser\nson mot de passe" as UC_Reset
    usecase "Se déconnecter" as UC_Logout
    usecase "Supprimer son compte\n(droit à l'effacement)" as UC_Delete
    usecase "Signaler un problème" as UC_Report
  }
  package "Administration" {
    usecase "Gérer les utilisateurs" as UC_AdminUsers
    usecase "Modérer les sessions\net les PJ" as UC_AdminModerate
    usecase "Importer les données\ndu compendium" as UC_AdminImport
  }
}

Visitor - -> UC_Register
Visitor - -> UC_Login
Visitor - -> UC_Reset
User - -> UC_Logout
User - -> UC_Delete
User - -> UC_Report
Admin - -> UC_AdminUsers
Admin - -> UC_AdminModerate
Admin - -> UC_AdminImport
UC_Reset - -> Mail

note right of UC_Login
  La connexion est une **précondition**
  des autres cas, pas un « include ».
end note
@enduml

